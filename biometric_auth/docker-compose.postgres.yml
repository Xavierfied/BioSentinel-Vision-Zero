# Local PostgreSQL for when you switch off SQLite. See docs/POSTGRES.md.
#   docker compose -f docker-compose.postgres.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: biosentinel
      POSTGRES_PASSWORD: biosentinel
      POSTGRES_DB: biosentinel
    ports:
      - "5432:5432"
    volumes:
      - biosentinel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biosentinel"]
      interval: 5s
      retries: 10

volumes:
  biosentinel-pg:
