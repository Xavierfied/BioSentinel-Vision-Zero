name: backend-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biometric_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: biometric_auth/requirements-test.txt
      - run: pip install -r requirements-test.txt
      # Tests generate their own SECRET_KEY and temp database.
      - run: python -m pytest -q
